name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl
          tools: composer:v2, box:4.6.7
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: vendor/bin/pest --ci --configuration=phpunit.xml

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Compile PHAR
        run: box compile

      - name: Verify executable
        run: ./build/gh-wizard.phar --version

      - name: Prepare release assets
        run: |
          mkdir -p dist

          for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            cp build/gh-wizard.phar "dist/gh-wizard-$platform"
          done

          chmod +x dist/gh-wizard-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gh-wizard
          path: dist/

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gh-wizard
          path: dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/gh-wizard-* \
            --verify-tag \
            --generate-notes \
            --title "gh-wizard $RELEASE_TAG"